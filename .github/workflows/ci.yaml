name: Build and publish
on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    
    name: Build Polkadot charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v32.0.0
    with:
      charmcraft-snap-revision: 6672
      cache: false
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download charm package(s)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
      - name: Select charmhub channel
        uses: canonical/charming-actions/channel@2.7.0
        id: channel
      - name: Upload charm to charmhub
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          channel: "${{ steps.channel.outputs.name }}/develop"
          github-tag: false
